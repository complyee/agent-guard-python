[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complyee-agent-guard"
version = "0.1.0"
description = "Run agent tools only on a verified Agent Control Room grant (LangGraph, CrewAI, LangChain and plain Python)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Complyee AB" }]
requires-python = ">=3.9"
keywords = ["ai-agents", "langgraph", "crewai", "langchain", "policy", "authorization", "jwt", "agent-control-room", "complyee"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25", "cryptography>=41"]

[project.urls]
Homepage = "https://agent-cr.com/plugins"
Repository = "https://github.com/complyee/agent-guard-python"
Issues = "https://github.com/complyee/agent-guard-python/issues"
Changelog = "https://github.com/complyee/agent-guard-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/complyee_agent_guard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
